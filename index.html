<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>早报图库</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
:root{--paper:#FBF8F3;--ink:#1F1B18;--muted:#8A7F75;--line:#E8E0D5;--soft:#F3EDE4;--accent:#C8412B;--ok:#2F7D4F;--bad:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171513;--ink:#F1EAE2;--muted:#9C918A;--line:#2E2925;--soft:#221E1B;--accent:#E0604A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#171513;--ink:#F1EAE2;--muted:#9C918A;--line:#2E2925;--soft:#221E1B;--accent:#E0604A;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font:16px/1.55 "Noto Sans SC",system-ui,-apple-system,sans-serif;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font:600 28px/1.2 "Noto Serif SC",Georgia,serif;letter-spacing:.02em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:var(--soft);border-radius:16px;padding:16px;margin-top:18px}
label{display:block;font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;font-weight:500;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--accent);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.big{width:100%;padding:20px;font-size:18px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
#log{font-size:14px;margin-top:10px;min-height:20px}
#log.ok{color:var(--ok)}#log.bad{color:var(--bad)}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-top:26px}
.head h2{font-size:17px;font-weight:500}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--soft)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .n{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 7px;border-radius:999px}
.tile .n.next{background:var(--accent)}
.tile .x{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:28px;text-align:center;padding:0}
.tile.video{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);background:var(--soft)}
.tile.video .ico{font-size:34px}
.tile .cv{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:4px 9px;border-radius:999px}
.tile .x.confirm{background:var(--bad);width:auto;padding:0 10px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
progress{width:100%;height:8px;margin-top:10px;accent-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>早报图库</h1>
<div class="sub">东京大事件 · 每天 07:30 用掉最早的一条（图片或视频）</div>

<section class="card" id="auth">
  <label for="pat">GitHub 令牌（只需填一次，存在本机浏览器）</label>
  <input type="password" id="pat" placeholder="github_pat_…" autocomplete="off">
  <div class="row"><button id="save">保存</button><button class="ghost" id="forget" hidden>清除</button></div>
  <div class="hint">令牌需要对 market-brief 仓库有 Contents 读写权限。</div>
</section>

<section id="main" hidden>
  <input type="file" id="file" accept="image/*,video/mp4,video/quicktime,video/webm" multiple hidden>
  <button class="big" id="pick">📷🎬 选择图片 / 视频上传</button>
  <div class="hint">图片自动压缩；视频原样上传，单个 ≤ 45MB（Telegram 上限）</div>
  <progress id="prog" value="0" max="1" hidden></progress>
  <div id="log"></div>
  <div class="head"><h2>队列</h2><span class="count" id="count"></span></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>队列为空，早报会用图库兜底</div>
  <div class="row" style="margin-top:14px"><button class="ghost" id="reload">刷新</button><button class="ghost" id="logout">换令牌</button></div>
</section>

<script>
const OWNER="ScareCrowInMountain", REPO="market-brief", DIR="assets/morning", BRANCH="main";
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`;
const $=id=>document.getElementById(id);
let token="";
try{token=localStorage.getItem("mb_pat")||""}catch(e){}

function headers(extra){return Object.assign({"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},extra||{})}
function log(msg,cls){const l=$("log");l.textContent=msg;l.className=cls||""}
function show(){const has=!!token;$("auth").hidden=has;$("main").hidden=!has;$("forget").hidden=!has;if(has)refresh()}

$("save").onclick=()=>{const v=$("pat").value.trim();if(!v)return;token=v;try{localStorage.setItem("mb_pat",v)}catch(e){};$("pat").value="";show()};
$("logout").onclick=$("forget").onclick=()=>{token="";try{localStorage.removeItem("mb_pat")}catch(e){};show()};
$("pick").onclick=()=>$("file").click();
$("reload").onclick=refresh;

const REL=`https://api.github.com/repos/${OWNER}/${REPO}/releases`;
const VIDEO_RE=/\.(mp4|mov|m4v|webm)$/i, IMAGE_RE=/\.(jpe?g|png|webp)$/i;
let releaseId=null;
async function queueRelease(){
  if(releaseId)return releaseId;
  let r=await fetch(REL+"/tags/queue",{headers:headers()});
  if(r.status===404){
    r=await fetch(REL,{method:"POST",headers:headers(),body:JSON.stringify({tag_name:"queue",name:"media queue",body:"Video queue for the morning post.",prerelease:true})});
  }
  if(!r.ok)throw new Error("读取视频队列失败 "+r.status);
  releaseId=(await r.json()).id;return releaseId;
}
async function listQueue(){
  const r=await fetch(API+"?ref="+BRANCH+"&t="+Date.now(),{headers:headers()});
  if(!r.ok&&r.status!==404)throw new Error("读取队列失败 "+r.status+(r.status===401?"（令牌无效）":r.status===403?"（令牌无权限）":""));
  const items=r.status===404?[]:await r.json();
  const imgs=items.filter(f=>f.type==="file"&&IMAGE_RE.test(f.name)).map(f=>({kind:"image",name:f.name,url:f.url,sha:f.sha}));
  let vids=[];
  try{
    const rr=await fetch(REL+"/tags/queue?t="+Date.now(),{headers:headers()});
    if(rr.ok){const rel=await rr.json();releaseId=rel.id;const covers={};(rel.assets||[]).forEach(a=>{if(a.name.endsWith(".cover.jpg"))covers[a.name]={id:a.id,url:REL+"/assets/"+a.id}});vids=(rel.assets||[]).filter(a=>VIDEO_RE.test(a.name)).map(a=>({kind:"video",name:a.name,id:a.id,size:a.size,url:REL+"/assets/"+a.id,cover:covers[a.name+".cover.jpg"]||null}))}
  }catch(e){}
  return imgs.concat(vids).sort((a,b)=>a.name<b.name?-1:1);
}
async function thumb(f,img){
  const acc=f.url.includes("/releases/assets/")?"application/octet-stream":"application/vnd.github.raw";
  try{const r=await fetch(f.url,{headers:headers({"Accept":acc})});if(!r.ok)return;img.src=URL.createObjectURL(await r.blob())}catch(e){}
}
function resizeTo(file,MAX,q){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("压缩失败")),"image/jpeg",q)};
    img.onerror=()=>rej(new Error("无法读取 "+file.name));img.src=url;
  });
}
function pickCover(video){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    try{
      log("上传封面…");
      const blob=await resizeTo(f,320,0.8);
      if(blob.size>200*1024)throw new Error("封面超过 200KB");
      const rid=await queueRelease();
      if(video.cover){await fetch(video.cover.url,{method:"DELETE",headers:headers()})}
      const r=await fetch(`https://uploads.github.com/repos/${OWNER}/${REPO}/releases/${rid}/assets?name=${encodeURIComponent(video.name+".cover.jpg")}`,
        {method:"POST",headers:headers({"Content-Type":"image/jpeg"}),body:blob});
      if(!r.ok)throw new Error("封面上传失败 "+r.status);
      log("封面已设置","ok");refresh();
    }catch(e){log(e.message,"bad")}
  };
  inp.click();
}
function fmtMB(n){return (n/1048576).toFixed(1)+" MB"}
async function refresh(){
  log("");
  try{
    const files=await listQueue();
    $("count").textContent=files.length?`${files.length} 条 ≈ ${files.length} 天`:"";
    $("empty").hidden=files.length>0;
    const g=$("grid");g.innerHTML="";
    files.forEach((f,i)=>{
      const t=document.createElement("div");t.className="tile"+(f.kind==="video"?" video":"");
      if(f.kind==="video"){
        if(f.cover){const img=document.createElement("img");img.alt=f.name;t.appendChild(img);thumb({url:f.cover.url},img);t.classList.remove("video")}
        else{t.innerHTML='<div class="ico">🎬</div><div>'+fmtMB(f.size)+'</div>'}
        const c=document.createElement("button");c.className="cv";c.textContent=f.cover?"换封面":"设封面";
        c.onclick=()=>pickCover(f);t.appendChild(c);
      }
      else{const img=document.createElement("img");img.alt=f.name;t.appendChild(img);thumb(f,img)}
      const n=document.createElement("span");n.className="n"+(i===0?" next":"");n.textContent=i===0?"下一条":String(i+1);t.appendChild(n);
      const x=document.createElement("button");x.className="x";x.textContent="×";x.setAttribute("aria-label","删除");
      let armed=false;
      x.onclick=async()=>{
        if(!armed){armed=true;x.textContent="确认删除";x.classList.add("confirm");setTimeout(()=>{armed=false;x.textContent="×";x.classList.remove("confirm")},3000);return}
        x.disabled=true;
        try{
          if(f.kind==="video"&&f.cover){await fetch(f.cover.url,{method:"DELETE",headers:headers()})}
          const r=f.kind==="video"
            ?await fetch(f.url,{method:"DELETE",headers:headers()})
            :await fetch(f.url,{method:"DELETE",headers:headers(),body:JSON.stringify({message:"chore: remove "+f.name,sha:f.sha,branch:BRANCH})});
          if(!r.ok&&r.status!==204)throw new Error("删除失败 "+r.status);
          log("已删除 "+f.name,"ok");refresh();
        }catch(e){log(e.message,"bad");x.disabled=false}
      };
      t.appendChild(x);g.appendChild(t);
    });
  }catch(e){log(e.message,"bad")}
}

function resize(file){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=1600;let w=img.naturalWidth,h=img.naturalHeight;
      const s=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("压缩失败")),"image/jpeg",0.86);
    };
    img.onerror=()=>rej(new Error("无法读取 "+file.name));
    img.src=url;
  });
}
function toB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
function stamp(d){const p=n=>String(n).padStart(2,"0");return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"-"+p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())}

$("file").onchange=async e=>{
  const files=[...e.target.files];e.target.value="";if(!files.length)return;
  $("pick").disabled=true;const prog=$("prog");prog.hidden=false;prog.max=files.length;prog.value=0;
  let ok=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    try{
      log(`上传中 ${i+1}/${files.length}…`);
      const isVideo=f.type.startsWith("video/")||VIDEO_RE.test(f.name);
      if(isVideo){
        if(f.size>45*1048576)throw new Error(f.name+" 超过 45MB，Telegram 发不出去");
        const ext=(f.name.match(/\.(mp4|mov|m4v|webm)$/i)||[".mp4"])[0].toLowerCase();
        const name=stamp(new Date())+"-"+String(i).padStart(2,"0")+ext;
        const rid=await queueRelease();
        const r=await fetch(`https://uploads.github.com/repos/${OWNER}/${REPO}/releases/${rid}/assets?name=${encodeURIComponent(name)}`,
          {method:"POST",headers:headers({"Content-Type":f.type||"video/mp4"}),body:f});
        if(!r.ok)throw new Error("视频上传失败 "+r.status+(r.status===401?"（令牌无效）":r.status===403?"（令牌无权限）":""));
      }else{
        const blob=await resize(f);
        const name=stamp(new Date())+"-"+String(i).padStart(2,"0")+".jpg";
        const r=await fetch(API+"/"+name,{method:"PUT",headers:headers(),body:JSON.stringify({message:"feat: queue "+name,content:await toB64(blob),branch:BRANCH})});
        if(!r.ok)throw new Error("上传失败 "+r.status+(r.status===401?"（令牌无效）":r.status===403?"（令牌无权限）":""));
      }
      ok++;prog.value=i+1;
      await new Promise(r=>setTimeout(r,1100));
    }catch(err){log(err.message,"bad")}
  }
  prog.hidden=true;$("pick").disabled=false;
  if(ok)log(`已上传 ${ok} 条`,"ok");
  refresh();
};
show();
</script>
</body>
</html>
