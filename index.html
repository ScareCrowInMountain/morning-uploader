<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>早报图库</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
:root{--paper:#FBF8F3;--ink:#1F1B18;--muted:#8A7F75;--line:#E8E0D5;--soft:#F3EDE4;--accent:#C8412B;--ok:#2F7D4F;--bad:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171513;--ink:#F1EAE2;--muted:#9C918A;--line:#2E2925;--soft:#221E1B;--accent:#E0604A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#171513;--ink:#F1EAE2;--muted:#9C918A;--line:#2E2925;--soft:#221E1B;--accent:#E0604A;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font:16px/1.55 "Noto Sans SC",system-ui,-apple-system,sans-serif;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font:600 28px/1.2 "Noto Serif SC",Georgia,serif;letter-spacing:.02em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:var(--soft);border-radius:16px;padding:16px;margin-top:18px}
label{display:block;font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;font-weight:500;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--accent);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.big{width:100%;padding:20px;font-size:18px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
#log{font-size:14px;margin-top:10px;min-height:20px}
#log.ok{color:var(--ok)}#log.bad{color:var(--bad)}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-top:26px}
.head h2{font-size:17px;font-weight:500}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--soft)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .n{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 7px;border-radius:999px}
.tile .n.next{background:var(--accent)}
.tile .x{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:28px;text-align:center;padding:0}
.tile .x.confirm{background:var(--bad);width:auto;padding:0 10px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
progress{width:100%;height:8px;margin-top:10px;accent-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>早报图库</h1>
<div class="sub">东京大事件 · 每天 07:30 用掉最早的一张</div>

<section class="card" id="auth">
  <label for="pat">GitHub 令牌（只需填一次，存在本机浏览器）</label>
  <input type="password" id="pat" placeholder="github_pat_…" autocomplete="off">
  <div class="row"><button id="save">保存</button><button class="ghost" id="forget" hidden>清除</button></div>
  <div class="hint">令牌需要对 market-brief 仓库有 Contents 读写权限。</div>
</section>

<section id="main" hidden>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <button class="big" id="pick">📷 选择图片上传</button>
  <progress id="prog" value="0" max="1" hidden></progress>
  <div id="log"></div>
  <div class="head"><h2>队列</h2><span class="count" id="count"></span></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>队列为空，早报会用图库兜底</div>
  <div class="row" style="margin-top:14px"><button class="ghost" id="reload">刷新</button><button class="ghost" id="logout">换令牌</button></div>
</section>

<script>
const OWNER="ScareCrowInMountain", REPO="market-brief", DIR="assets/morning", BRANCH="main";
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`;
const $=id=>document.getElementById(id);
let token="";
try{token=localStorage.getItem("mb_pat")||""}catch(e){}

function headers(extra){return Object.assign({"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},extra||{})}
function log(msg,cls){const l=$("log");l.textContent=msg;l.className=cls||""}
function show(){const has=!!token;$("auth").hidden=has;$("main").hidden=!has;$("forget").hidden=!has;if(has)refresh()}

$("save").onclick=()=>{const v=$("pat").value.trim();if(!v)return;token=v;try{localStorage.setItem("mb_pat",v)}catch(e){};$("pat").value="";show()};
$("logout").onclick=$("forget").onclick=()=>{token="";try{localStorage.removeItem("mb_pat")}catch(e){};show()};
$("pick").onclick=()=>$("file").click();
$("reload").onclick=refresh;

async function listQueue(){
  const r=await fetch(API+"?ref="+BRANCH+"&t="+Date.now(),{headers:headers()});
  if(r.status===404)return[];
  if(!r.ok)throw new Error("读取队列失败 "+r.status+(r.status===401?"（令牌无效）":r.status===403?"（令牌无权限）":""));
  const items=await r.json();
  return items.filter(f=>f.type==="file"&&/\.(jpe?g|png|webp)$/i.test(f.name)).sort((a,b)=>a.name<b.name?-1:1);
}
async function thumb(f,img){
  try{const r=await fetch(f.url,{headers:headers({"Accept":"application/vnd.github.raw"})});if(!r.ok)return;img.src=URL.createObjectURL(await r.blob())}catch(e){}
}
async function refresh(){
  log("");
  try{
    const files=await listQueue();
    $("count").textContent=files.length?`${files.length} 张 ≈ ${files.length} 天`:"";
    $("empty").hidden=files.length>0;
    const g=$("grid");g.innerHTML="";
    files.forEach((f,i)=>{
      const t=document.createElement("div");t.className="tile";
      const img=document.createElement("img");img.alt=f.name;t.appendChild(img);thumb(f,img);
      const n=document.createElement("span");n.className="n"+(i===0?" next":"");n.textContent=i===0?"下一张":String(i+1);t.appendChild(n);
      const x=document.createElement("button");x.className="x";x.textContent="×";x.setAttribute("aria-label","删除");
      let armed=false;
      x.onclick=async()=>{
        if(!armed){armed=true;x.textContent="确认删除";x.classList.add("confirm");setTimeout(()=>{armed=false;x.textContent="×";x.classList.remove("confirm")},3000);return}
        x.disabled=true;
        try{
          const r=await fetch(f.url,{method:"DELETE",headers:headers(),body:JSON.stringify({message:"chore: remove "+f.name,sha:f.sha,branch:BRANCH})});
          if(!r.ok)throw new Error("删除失败 "+r.status);
          log("已删除 "+f.name,"ok");refresh();
        }catch(e){log(e.message,"bad");x.disabled=false}
      };
      t.appendChild(x);g.appendChild(t);
    });
  }catch(e){log(e.message,"bad")}
}

function resize(file){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=1600;let w=img.naturalWidth,h=img.naturalHeight;
      const s=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("压缩失败")),"image/jpeg",0.86);
    };
    img.onerror=()=>rej(new Error("无法读取 "+file.name));
    img.src=url;
  });
}
function toB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
function stamp(d){const p=n=>String(n).padStart(2,"0");return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"-"+p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())}

$("file").onchange=async e=>{
  const files=[...e.target.files];e.target.value="";if(!files.length)return;
  $("pick").disabled=true;const prog=$("prog");prog.hidden=false;prog.max=files.length;prog.value=0;
  let ok=0;
  for(let i=0;i<files.length;i++){
    try{
      log(`上传中 ${i+1}/${files.length}…`);
      const blob=await resize(files[i]);
      const name=stamp(new Date())+"-"+String(i).padStart(2,"0")+".jpg";
      const r=await fetch(API+"/"+name,{method:"PUT",headers:headers(),body:JSON.stringify({message:"feat: queue "+name,content:await toB64(blob),branch:BRANCH})});
      if(!r.ok)throw new Error("上传失败 "+r.status+(r.status===401?"（令牌无效）":r.status===403?"（令牌无权限）":""));
      ok++;prog.value=i+1;
      await new Promise(r=>setTimeout(r,1100)); // keep file names unique & be gentle with the API
    }catch(err){log(err.message,"bad")}
  }
  prog.hidden=true;$("pick").disabled=false;
  if(ok)log(`已上传 ${ok} 张`,"ok");
  refresh();
};
show();
</script>
</body>
</html>
